name: Publish verified Level11 dreamcore and provisions
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact reviewed source commit
        required: true
      verification_run:
        description: Full verification run for that exact commit
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      VERIFIED_RUN: ${{ inputs.verification_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require complete verification of the exact source
        shell: bash
        run: |
          gh run watch "${VERIFIED_RUN}" --exit-status --interval 30
          gh api "repos/${GH_REPO}/actions/runs/${VERIFIED_RUN}" > /tmp/food-run.json
          python - <<'PY'
          import json,os,re
          r=json.load(open('/tmp/food-run.json'))
          assert re.fullmatch('[a-f0-9]{40}',os.environ['SOURCE_REVISION'])
          assert r['head_sha']==os.environ['SOURCE_REVISION'] and r['status']=='completed' and r['conclusion']=='success'
          assert r['path']=='.github/workflows/verify-and-package.yml'
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
      - name: Fetch immutable patch compatibility source
        run: git fetch --no-tags --depth=1 origin b6e631b39f01915fcd367cf3abd4106e27c0707a
      - name: Create complete Assets and cumulative patch
        shell: bash
        run: |
          python tools/package_assets.py --stage nivel11-dreamcore-provisiones --output "${RUNNER_TEMP}/Poolrooms_Nivel11_Provisiones_Assets.zip" > /tmp/food-full.json
          python tools/package_city_provisions.py --output "${RUNNER_TEMP}/Poolrooms_Parche_Nivel11_Provisiones.zip" > /tmp/food-patch.json
      - name: Verify contents and write delivery checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          full=json.load(open('/tmp/food-full.json'));patch=json.load(open('/tmp/food-patch.json'))
          assert full['sourceRevision']==patch['sourceRevision']==os.environ['SOURCE_REVISION']
          assert not full['workingTreeChanged'] and not patch['workingTreeChanged']
          with zipfile.ZipFile(full['zip']) as a,zipfile.ZipFile(patch['zip']) as b:
              assert a.testzip() is None and b.testzip() is None
              manifest=json.loads(b.read('PARCHE_MANIFIESTO.json'))
              for name,entry in manifest['files'].items():
                  data=b.read(name)
                  assert data==a.read(name) and len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256']
          out=pathlib.Path(os.environ['RUNNER_TEMP']);size=sum(p.stat().st_size for p in pathlib.Path('Assets').rglob('*') if p.is_file())
          record={'sourceRevision':os.environ['SOURCE_REVISION'],'successfulFullRun':os.environ['VERIFIED_RUN'],'assetsUncompressedBytes':size,'package':full,'patch':patch,'nativeUnityExecuted':False,'newExternalModels':125,'foodTypes':103,'foodPresentations':117,'drinks':8,'newOriginalPbrSets':4,'newOriginalLabelMaps':1,'paddingBytes':0}
          (out/'Poolrooms_Nivel11_Provisiones_Entrega.json').write_text(json.dumps(record,indent=2)+'\n')
          (out/'Poolrooms_Nivel11_Provisiones_SHA256.txt').write_text('\n'.join(d['sha256']+'  '+pathlib.Path(d['zip']).name for d in (full,patch))+'\n')
          notes=f'''Nivel11 con tres programas de pabellón público abierto, soportales, jardines, pérgolas, bancas y luz regional de tarde. Conserva calles transitables, edificios importados, tres edificios con plantas/escaleras por manzana y vehículos existentes. Es una adaptación dreamcore original, no una réplica canónica completa.

          103 tipos de comida en 117 presentaciones y 8 bebidas, incluida agua de almendra. 125 modelos distintos de Kenney Food Kit 2.0 (CC0), limpieza de caras duplicadas, redondeado y LOD; cuatro juegos originales de mapas PBR a 1024px y una etiqueta original. Geometría de origen estilizada: no se presenta como fotogrametría.

          Distribución integrada en habitaciones de los 63 biomas, ambos centros comerciales y casas detalladas del Nivel94. Máximo una mesa y cuatro objetos por sector; exige apoyo y espacio físico, rechaza huecos y pasos bloqueados. No garantiza mesa en cada habitación. E guarda comida directamente; T toma, Z guarda, Tab abre el inventario. Pilas sin límite; sin HUD nuevo, hambre ni sed. Inventario de sesión, sin guardado persistente.

          Comprobaciones de núcleo/código, licencias, hashes y geometrías protegidas superadas para `{os.environ['SOURCE_REVISION']}`: run {os.environ['VERIFIED_RUN']}. Unity/PlayMode, shaders, HDRP, ray tracing, aspecto, física nativa y FPS pendientes; no hay Editor en este entorno.

          Con Unity detenido, actualiza la única carpeta PoolroomsProcedural dentro de Assets; sobrescribe/añade y conserva los demás recursos y .meta. Regenera la demo. El parche requiere Cinco horizontes o una entrega posterior, incluida Superficies estables. El paquete Assets es completo. No instales dos copias paralelas.

          Assets completos: {full['bytes']:,} bytes comprimidos, {size:,} sin comprimir. Parche: {patch['bytes']:,} bytes. Sin archivos de relleno. Guía: https://github.com/{os.environ['GH_REPO']}/blob/{os.environ['SOURCE_REVISION']}/Assets/PoolroomsProcedural/Documentation/Nivel11_Provisiones.md
          '''
          (out/'food-notes.md').write_text('\n'.join(line.strip() for line in notes.splitlines()))
          PY
      - name: Publish immutable verified update
        shell: bash
        run: |
          gh release create nivel11-dreamcore-provisiones --target "${SOURCE_REVISION}" --title "Nivel11 dreamcore y comida para compartir" --notes-file "${RUNNER_TEMP}/food-notes.md" "${RUNNER_TEMP}/Poolrooms_Nivel11_Provisiones_Assets.zip" "${RUNNER_TEMP}/Poolrooms_Parche_Nivel11_Provisiones.zip" "${RUNNER_TEMP}/Poolrooms_Nivel11_Provisiones_Entrega.json" "${RUNNER_TEMP}/Poolrooms_Nivel11_Provisiones_SHA256.txt"
