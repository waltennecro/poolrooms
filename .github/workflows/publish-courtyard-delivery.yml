name: Publish verified hotel courtyard and skin import update
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact reviewed source commit
        required: true
      verification_run:
        description: Full verification run for that exact commit; publication waits for success
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      VERIFIED_RUN: ${{ inputs.verification_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require complete verification of the exact source
        shell: bash
        run: |
          gh run watch "${VERIFIED_RUN}" --exit-status --interval 30
          gh api "repos/${GH_REPO}/actions/runs/${VERIFIED_RUN}" > /tmp/hotel-run.json
          python - <<'PY'
          import json,os,re
          r=json.load(open('/tmp/hotel-run.json'))
          assert re.fullmatch('[a-f0-9]{40}',os.environ['SOURCE_REVISION'])
          assert r['head_sha']==os.environ['SOURCE_REVISION']
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['path']=='.github/workflows/verify-and-package.yml'
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
      - name: Fetch immutable patch compatibility source
        run: git fetch --no-tags --depth=1 origin b6e631b39f01915fcd367cf3abd4106e27c0707a
      - name: Create complete Assets and cumulative patch
        shell: bash
        run: |
          python tools/package_assets.py --stage hotel-ventanas-skins --output "${RUNNER_TEMP}/Poolrooms_Hotel_Ventanas_Assets.zip" > /tmp/hotel-full.json
          python tools/package_courtyard_update.py --output "${RUNNER_TEMP}/Poolrooms_Parche_Hotel_y_Skins.zip" > /tmp/hotel-patch.json
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          full=json.load(open('/tmp/hotel-full.json'));patch=json.load(open('/tmp/hotel-patch.json'))
          assert full['sourceRevision']==patch['sourceRevision']==os.environ['SOURCE_REVISION']
          assert not full['workingTreeChanged'] and not patch['workingTreeChanged']
          with zipfile.ZipFile(full['zip']) as a,zipfile.ZipFile(patch['zip']) as b:
              assert a.testzip() is None and b.testzip() is None
              m=json.loads(b.read('PARCHE_MANIFIESTO.json'))
              for name,entry in m['files'].items():
                  data=b.read(name)
                  assert data==a.read(name)
                  assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])
          size=sum(p.stat().st_size for p in pathlib.Path('Assets').rglob('*') if p.is_file())
          record={'sourceRevision':os.environ['SOURCE_REVISION'],'successfulFullRun':os.environ['VERIFIED_RUN'],
                  'assetsUncompressedBytes':size,'package':full,'patch':patch,'nativeUnityExecuted':False,'newExternalModels':0,'paddingBytes':0}
          (out/'Poolrooms_Hotel_Entrega.json').write_text(json.dumps(record,indent=2)+'\n')
          (out/'Poolrooms_Hotel_SHA256.txt').write_text('\n'.join(a['sha256']+'  '+pathlib.Path(a['zip']).name for a in (full,patch))+'\n')
          notes=f'''Primera reconstrucción individual: Patio de ventanas / Nivel 188. Hotel de cinco plantas alrededor de un patio continuo, cuatro zonas verdes y círculo de madera, habitaciones, recepción, lavanderías, escaleras reales hasta la azotea, puertas y persianas operables. Referencias y adaptaciones documentadas; no se reutiliza la fotografía original ni contenido de otro juego.

          Corrige CreateImpl en PoolroomsInteractable. La importación de skins muestra el resultado junto al botón, conserva archivos externos en el selector y permite ver el modelo en tercera persona. Si falla la adaptación anatómica se conserva el modelo estático. OBJ directo hasta 64 MiB con presupuesto de geometría acotado; otros formatos mantienen sus requisitos de importador.

          Incluye todo el contenido anterior y los arreglos de compilación/rutas. Los demás niveles genéricos siguen pendientes de reconstrucción individual. Distancia de renderizado, linterna e IDs conservados. Muebles y PBR existentes con sus licencias; cero modelos externos nuevos.

          Assets completos: {full['bytes']:,} bytes comprimidos, {size:,} bytes sin comprimir. Parche acumulativo: {patch['bytes']:,} bytes, compatible con Cinco horizontes, Compilación corregida y Rutas flexibles. Copiar dentro de la carpeta PoolroomsProcedural existente con Unity detenido, conservando recursos y .meta; no instalar una segunda copia del código.

          Verificación completa y empaquetado de `{os.environ['SOURCE_REVISION']}` superados; CRC/SHA-256 y parche comparados con el paquete completo. Comprobaciones matemáticas/de código, no pruebas nativas de Unity. Unity/HDRP, shaders, apariencia, física, audio y FPS pendientes: no hay Editor en este entorno.

          Guía: https://github.com/{os.environ['GH_REPO']}/blob/{os.environ['SOURCE_REVISION']}/Assets/PoolroomsProcedural/Documentation/Hotel_de_ventanas_y_skins.md
          '''
          (out/'hotel-notes.md').write_text('\n'.join(line.strip() for line in notes.splitlines()))
          PY
      - name: Publish immutable verified update
        shell: bash
        run: |
          gh release create hotel-ventanas-skins --target "${SOURCE_REVISION}" --title "Hotel de ventanas y skins visibles" --notes-file "${RUNNER_TEMP}/hotel-notes.md" "${RUNNER_TEMP}/Poolrooms_Hotel_Ventanas_Assets.zip" "${RUNNER_TEMP}/Poolrooms_Parche_Hotel_y_Skins.zip" "${RUNNER_TEMP}/Poolrooms_Hotel_Entrega.json" "${RUNNER_TEMP}/Poolrooms_Hotel_SHA256.txt"
