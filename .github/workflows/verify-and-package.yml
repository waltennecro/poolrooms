name: Verify reconstructed core and package Assets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify pinned SDK resolution
        shell: bash
        run: |
          selected_sdk="$(dotnet --version)"
          test "$selected_sdk" = "8.0.408"
          dotnet --info
      - name: Compile core, compare geometry, check CSharp syntax
        run: |
          dotnet build Verification/Poolrooms.Checks.csproj --configuration Release -warnaserror
          dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj
      - name: Check detailed mall geometry, licensed placement and floor-local lighting
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --mall-retail
      - name: Check twelve workshops, constructive solutions, state meshes and bounded session memory
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --workshops
      - name: Check procedural furnishing, real-room integration, support, clearance and bounded work
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --scenery
      - name: Check independent frontend lifecycle, cancellation, seed selection and transitions
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --frontend
      - name: Check large procedural regions, broad halls and bounded walking routes
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --large-regions
      - name: Check ten special regions, preserved discovery slots and walking graph
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --special-regions
      - name: Check all new restful recipe banks and architectural axes
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --restful-levels --restful-exhaustive
      - name: Check refined detail, clearance and material geometry
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --restful-refinement
      - name: Compare all 200010 architectures in 21 batches against immutable R33
        shell: bash
        run: |
          git cat-file -e 0a43903830cf694377118229a23dbeeed9a6346b || git fetch --no-tags --depth=1 origin 0a43903830cf694377118229a23dbeeed9a6346b
          python tools/refine_restful_batches.py --output "${{ runner.temp }}/R34-batches" --expect-report Verification/refinement_R34_batches.json
      - name: Check actual-world object placement counts
        run: |
          dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --restful-world
      - name: Check newly licensed restful source objects
        run: python tools/verify_restful_sources.py
      - name: Check normal wing flight and original geometry catalogue
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --wings
      - name: Check licensed wing selector icons and source attribution
        run: python tools/verify_wing_sources.py
      - name: Check larger biome areas, populated Level94 and accessible mall expansion
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --biome-extents
      - name: Check expanded biome recipes, house footprints and mall reservations
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --variety-expansion
      - name: Check full aquatic catalogue at extreme room scales
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --aquatic-plans
      - name: Audit generated data, source lookups and room streaming selection
        run: dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --generation-audit
      - name: Check source texture hashes
        run: python tools/verify_play_textures.py
      - name: Check original rain texture and audio resources
        run: python tools/verify_rain_resources.py
      - name: Check licensed City11 source assets and LODs
        run: python tools/verify_city_sources.py
      - name: Check licensed aircraft sources and native resource hashes
        run: python tools/verify_aircraft_sources.py
      - name: Check licensed helicopter source, pivots and LODs
        run: python tools/verify_helicopter_sources.py
      - name: Check attributed furniture, UV maps and placement dimensions
        run: python tools/verify_interior_sources.py
      - name: Check additional licensed urban sources and wheel assemblies
        run: python tools/verify_urban_sources.py
      - name: Check attributed Bistro components, PBR maps and metric dimensions
        run: python tools/verify_bistro_sources.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned offline art verification tools
        run: python -m pip install -r Verification/requirements-art-tools.txt
      - name: Check twenty new level resource banks, licences, metric bounds and PBR bindings
        run: python tools/verify_journey_resources.py
      - name: Check six original menu illustrations and importer bindings
        run: python tools/verify_frontend_art.py
      - name: Check licensed mall models, LODs, native PBR maps and reference attribution
        run: python tools/verify_mall_resources.py
      - name: Check immersive sound, local library and shipped PCM
        run: |
          dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --immersive-audio
          python tools/verify_immersive_audio.py
      - name: Check walkable encounters, inventory transactions and licensed resources
        run: |
          dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --encounter
          python tools/verify_encounter_resources.py
          dotnet run --no-build --configuration Release --project Verification/Poolrooms.Checks.csproj -- --immersion-stations
          python tools/verify_immersion_audio.py
      - name: Check licensed garden source, alpha cutout and static-only adaptation
        run: python tools/verify_garden_sources.py
      - name: Check licensed thermal lamp, wicker maps and source attribution
        run: python tools/verify_bath_sources.py
      - name: Check building subtraction areas, UVs, licences and all LOD access volumes
        run: |
          python tools/check_building_geometry.py
          python tools/verify_building_sources.py
      - name: Check UV baking transforms, colour sampling and normals
        run: python tools/check_uv_baker.py
      - name: Check native runner rejects missing, stale, failed or empty results
        run: python tools/check_native_runner.py
      - name: Create verified complete Assets package
        run: python tools/package_assets.py --stage reconstruccion --output "${{ runner.temp }}/Poolrooms_Reconstruccion_Assets.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Poolrooms-Reconstruccion-Assets
          path: ${{ runner.temp }}/Poolrooms_Reconstruccion_Assets.zip
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: R34-Batch-Evidence
          path: |
            ${{ runner.temp }}/R34-batches/report.json
            ${{ runner.temp }}/R34-batches/before/summary.json
            ${{ runner.temp }}/R34-batches/after/summary.json
            ${{ runner.temp }}/R34-batches/before-regression.log
          if-no-files-found: error
          retention-days: 90
