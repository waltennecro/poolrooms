name: Publish verified independent frontend delivery
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact source commit with successful full verification
        required: true
      verification_run:
        description: Full successful verification run for that commit
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      VERIFIED_RUN: ${{ inputs.verification_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require successful full verification of exact source
        shell: bash
        run: |
          gh run watch "${VERIFIED_RUN}" --exit-status --interval 30
          gh api "repos/${GH_REPO}/actions/runs/${VERIFIED_RUN}" > /tmp/workshop-verified-run.json
          python - <<'PY'
          import json,os,re
          r=json.load(open('/tmp/workshop-verified-run.json'))
          assert re.fullmatch('[a-f0-9]{40}',os.environ['SOURCE_REVISION'])
          assert r['head_sha']==os.environ['SOURCE_REVISION']
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['path']=='.github/workflows/verify-and-package.yml'
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package complete current Assets and verify every entry
        shell: bash
        run: |
          python tools/package_assets.py --stage menu-independiente --output "${RUNNER_TEMP}/Poolrooms_Menu_Independiente_Assets.zip" > /tmp/workshop-assets.json
          python - <<'PY'
          import json,os,pathlib
          a=json.load(open('/tmp/workshop-assets.json'));out=pathlib.Path(os.environ['RUNNER_TEMP'])
          assert a['sourceRevision']==os.environ['SOURCE_REVISION'] and not a['workingTreeChanged']
          size=sum(p.stat().st_size for p in pathlib.Path('Assets').rglob('*') if p.is_file())
          assert 0<size<=6_000_000_000
          record={'sourceRevision':os.environ['SOURCE_REVISION'],'successfulFullRun':os.environ['VERIFIED_RUN'],
              'assetsUncompressedBytes':size,'package':a,'nativeUnityExecuted':False,'paddingBytes':0}
          (out/'Poolrooms_Menu_Entrega.json').write_text(json.dumps(record,indent=2)+'\n')
          (out/'Poolrooms_Menu_SHA256.txt').write_text(a['sha256']+'  '+pathlib.Path(a['zip']).name+'\n')
          notes=f'''Menú principal independiente: el mundo procedural y el jugador solo se crean al comenzar. Compatibilidad automática con demos anteriores y herramienta para generar una escena de inicio dedicada.

          Seis fondos originales, transiciones suaves, selección entre 58 biomas más centro comercial y Nivel 94, semilla numérica o textual, ajustes previos a la partida, créditos y confirmaciones. Continuar retoma la sesión abierta; no se simula un guardado de partida. Se conservan iluminación de escena, posición e inventario al volver al menú.

          Paquete completo de Assets: {a['bytes']:,} bytes comprimidos; {size:,} bytes reales sin comprimir. CRC y SHA-256 de cada archivo comprobados. Importa PoolroomsProcedural dentro de Assets con Unity detenido.

          Verificación completa del commit `{os.environ['SOURCE_REVISION']}` superada: núcleo, ciclo de menú/carga, geometrías protegidas, sintaxis, seis ilustraciones, recursos, licencias y empaquetado. Pruebas nativas Unity/HDRP, controles, shaders, audio, física, apariencia y FPS pendientes: el entorno no tiene Unity.

          Guía: https://github.com/{os.environ['GH_REPO']}/blob/{os.environ['SOURCE_REVISION']}/Assets/PoolroomsProcedural/Documentation/Menu_Independiente.md
          '''
          (out/'workshop-release.md').write_text('\n'.join(line.strip() for line in notes.splitlines()))
          print(json.dumps(record))
          PY
      - name: Publish immutable complete package
        shell: bash
        run: |
          gh release create menu-independiente --target "${SOURCE_REVISION}" --title "Menú independiente: seis fondos y selección de recorrido" --notes-file "${RUNNER_TEMP}/workshop-release.md" "${RUNNER_TEMP}/Poolrooms_Menu_Independiente_Assets.zip" "${RUNNER_TEMP}/Poolrooms_Menu_SHA256.txt" "${RUNNER_TEMP}/Poolrooms_Menu_Entrega.json"
