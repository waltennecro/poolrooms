name: Publish verified Crystal Conservatory
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact reviewed source commit
        required: true
      verification_run:
        description: Full verification run for that exact commit; publication waits for success
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      VERIFIED_RUN: ${{ inputs.verification_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require complete verification of the exact source
        shell: bash
        run: |
          gh run watch "${VERIFIED_RUN}" --exit-status --interval 30
          gh api "repos/${GH_REPO}/actions/runs/${VERIFIED_RUN}" > /tmp/hotel-run.json
          python - <<'PY'
          import json,os,re
          r=json.load(open('/tmp/hotel-run.json'))
          assert re.fullmatch('[a-f0-9]{40}',os.environ['SOURCE_REVISION'])
          assert r['head_sha']==os.environ['SOURCE_REVISION']
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['path']=='.github/workflows/verify-and-package.yml'
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
      - name: Fetch immutable patch compatibility source
        run: git fetch --no-tags --depth=1 origin b6e631b39f01915fcd367cf3abd4106e27c0707a
      - name: Create complete Assets and cumulative patch
        shell: bash
        run: |
          python tools/package_assets.py --stage invernadero-cristal --output "${RUNNER_TEMP}/Poolrooms_Invernadero_Assets.zip" > /tmp/hotel-full.json
          python tools/package_conservatory_update.py --output "${RUNNER_TEMP}/Poolrooms_Parche_Invernadero.zip" > /tmp/hotel-patch.json
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          full=json.load(open('/tmp/hotel-full.json'));patch=json.load(open('/tmp/hotel-patch.json'))
          assert full['sourceRevision']==patch['sourceRevision']==os.environ['SOURCE_REVISION']
          assert not full['workingTreeChanged'] and not patch['workingTreeChanged']
          with zipfile.ZipFile(full['zip']) as a,zipfile.ZipFile(patch['zip']) as b:
              assert a.testzip() is None and b.testzip() is None
              m=json.loads(b.read('PARCHE_MANIFIESTO.json'))
              for name,entry in m['files'].items():
                  data=b.read(name)
                  assert data==a.read(name)
                  assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])
          size=sum(p.stat().st_size for p in pathlib.Path('Assets').rglob('*') if p.is_file())
          record={'sourceRevision':os.environ['SOURCE_REVISION'],'successfulFullRun':os.environ['VERIFIED_RUN'],
                  'assetsUncompressedBytes':size,'package':full,'patch':patch,'nativeUnityExecuted':False,'newExternalModels':0,'newExternalTextureSets':1,'paddingBytes':0}
          (out/'Poolrooms_Invernadero_Entrega.json').write_text(json.dumps(record,indent=2)+'\n')
          (out/'Poolrooms_Invernadero_SHA256.txt').write_text('\n'.join(a['sha256']+'  '+pathlib.Path(a['zip']).name for a in (full,patch))+'\n')
          notes=f'''Tercera reconstrucción individual: Invernadero de Cristal, reemplazo completo del Conservatory genérico. Cúpula continua de hierro y cristal sobre distritos de 4x4 sectores, rotonda con estanque compartido, dos alturas, pasarelas, puentes, escaleras reales y ocho programas botánicos. Viveros, herbarios, bancales, pérgolas, terrazas y pabellones de té, con actividades, armarios funcionales, asientos, recogibles y relatos cálidos. Entradas caminables entre biomas; no requiere modo maestro.

          Nuevo suelo PBR 2048² de ambientCG Ground037 con licencia CC0 y procedencia/hashes. Siete modelos existentes reutilizados, cero modelos externos nuevos; vegetación original agrupada, sin objetos por hoja. Sol regional único, exposición propia, reflejos y opciones RT existentes. Techo acristalado con colisión para el vuelo, estanques con fondo y escalones de salida, cierres de streaming sumergidos. Distancia de renderizado y funciones anteriores conservadas.

          Incluye hotel 188, Cygnus, skins y correcciones previas. Catálogo de 63 biomas con IDs conservados; este es un diseño original liminal, no una réplica canónica. Otros 46 programas genéricos siguen pendientes de reconstrucción individual.

          Assets completos: {full['bytes']:,} bytes comprimidos, {size:,} bytes sin comprimir. Parche acumulativo: {patch['bytes']:,} bytes. Compatible con Cinco horizontes y entregas posteriores, incluido Cygnus. Con Unity detenido, copiar PoolroomsProcedural sobre la carpeta existente dentro de Assets, conservando recursos y .meta; no instalar otra copia paralela del código.

          Verificación completa y empaquetado de `{os.environ['SOURCE_REVISION']}` superados; CRC/SHA-256 y parche comparados con el paquete completo. Comprobaciones del núcleo/código, no pruebas nativas de Unity. Unity/HDRP, shaders, apariencia, física, audio y FPS pendientes: no hay Editor aquí. Las fotografías de referencia no se redistribuyen en Assets.

          Guía: https://github.com/{os.environ['GH_REPO']}/blob/{os.environ['SOURCE_REVISION']}/Assets/PoolroomsProcedural/Documentation/Invernadero_de_Cristal.md
          '''
          (out/'hotel-notes.md').write_text('\n'.join(line.strip() for line in notes.splitlines()))
          PY
      - name: Publish immutable verified update
        shell: bash
        run: |
          gh release create invernadero-cristal --target "${SOURCE_REVISION}" --title "Invernadero de Cristal: jardines, pasarelas y agua" --notes-file "${RUNNER_TEMP}/hotel-notes.md" "${RUNNER_TEMP}/Poolrooms_Invernadero_Assets.zip" "${RUNNER_TEMP}/Poolrooms_Parche_Invernadero.zip" "${RUNNER_TEMP}/Poolrooms_Invernadero_Entrega.json" "${RUNNER_TEMP}/Poolrooms_Invernadero_SHA256.txt"
