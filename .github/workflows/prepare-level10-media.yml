name: Prepare attributed Level10 native media
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/import_level10_textures.py
            /Assets/PoolroomsProcedural/Resources/Forest39/Licenses/CC0-1.0.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install Pillow==11.1.0
      - name: Import native maps, verify LFS object hashes and pack HDRP channels
        run: python tools/import_level10_textures.py --cache "${{ runner.temp }}/upstream"
      - name: Package reproducible attributed resource bank
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path('Assets/PoolroomsProcedural/Resources/Level10')
          m=json.loads((root/'manifest.json').read_text())
          assert m['runtimeBytes']>=200_000_000 and not m['upscaled'] and m['newNativeTextureSets']==3
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'Level10_Medios_Nativos.zip'
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      data=p.read_bytes();info=zipfile.ZipInfo(p.relative_to(root).as_posix(),(2026,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;z.writestr(info,data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              for name,e in m['files'].items():
                  data=z.read(name);assert len(data)==e['bytes'] and hashlib.sha256(data).hexdigest()==e['sha256']
          print(json.dumps(dict(bytes=out.stat().st_size,sha256=hashlib.sha256(out.read_bytes()).hexdigest(),nativeBytes=m['runtimeBytes'])))
          PY
      - name: Publish source media for verified game integration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create nivel10-medios-nativos --target "${{ github.sha }}" --prerelease --title "Nivel10 · banco CC0 nativo para integración" --notes "Banco de recursos PBR con procedencia, hashes y CC0. No es una versión jugable del nivel. Tres conjuntos nativos a 4K; sin ampliar imágenes ni duplicar originales. Integración del juego pendiente." "${{ runner.temp }}/Level10_Medios_Nativos.zip"
